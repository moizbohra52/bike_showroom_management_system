org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cannot close its cache files on this
# toolchain (JDK 18 with the bundled Kotlin build-tools API), which fails
# plugin compilation with "Could not close incremental caches".
# Incremental compilation is a rebuild-speed optimisation only, so disabling
# it is safe; remove this once the project standardises on JDK 17 or 21.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
