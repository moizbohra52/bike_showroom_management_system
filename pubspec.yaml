name: bike_showroom_management_system
description: "Enterprise Bike Showroom Management System - multi-showroom sales, service, finance and accounting platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---------------------------------------------------------------- state / DI
  get: ^4.7.2

  # ------------------------------------------------------------------ network
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # ----------------------------------------------------------------- backend
  supabase_flutter: ^2.8.0

  # ---------------------------------------------------------------- firebase
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # --------------------------------------------------------- local persistence
  shared_preferences: ^2.3.3
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.1.0
  flutter_secure_storage: ^9.2.2

  # ------------------------------------------------------------------- files
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  image: ^4.3.0
  cached_network_image: ^3.4.1
  share_plus: ^10.1.2
  open_filex: ^4.5.0

  # ------------------------------------------------------- reporting / export
  pdf: ^3.11.1
  printing: ^5.13.3
  excel: ^4.0.6
  csv: ^6.0.0

  # ---------------------------------------------------------------------- ui
  fl_chart: ^0.69.2
  data_table_2: ^2.5.16
  flutter_svg: ^2.0.16
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # ------------------------------------------------------------------- utils
  uuid: ^4.5.1
  collection: ^1.19.0
  crypto: ^3.0.6
  decimal: ^3.0.2
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.1
  url_launcher: ^6.3.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Pure-Dart Supabase client (no Flutter/plugin bindings). Used only by
  # test/integration/, which exercises SupabaseRepository against a real
  # PostgREST + PostgreSQL instance rather than against Flutter plugins.
  supabase: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
