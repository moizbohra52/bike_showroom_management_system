# Enterprise Bike Showroom Management System - static analysis configuration.
#
# Project standard (see docs/ARCHITECTURE.md):
#   * Strong typing and null-safety are mandatory.
#   * All project-level members are PUBLIC. Lints that push towards private
#     members are therefore intentionally disabled.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat unused code as an error so dead abstractions never accumulate.
    unused_import: error
    unused_local_variable: error
    unused_element: warning
    dead_code: error
    # Project convention: public members are required, so these are noise.
    library_private_types_in_public_api: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # --- correctness -------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: false
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    prefer_void_to_null: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    unrelated_type_equality_checks: true
    use_build_context_synchronously: true

    # --- style / consistency ----------------------------------------------
    always_use_package_imports: true
    annotate_overrides: true
    avoid_redundant_argument_values: false
    avoid_unused_constructor_parameters: true
    directives_ordering: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    unawaited_futures: true
    use_super_parameters: true

    # --- explicitly disabled (conflict with project standards) ------------
    # Private members are not used for project classes.
    prefer_final_fields: false
    # Reactive GetX controllers expose mutable Rx fields by design.
    public_member_api_docs: false
